resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page na raiz
    location = / {
        try_files /landing.html =404;
    }

    # Landing também acessível em /landing
    location = /landing {
        try_files /landing.html =404;
    }

    # Segurança: dotfiles nunca são servidos. Sem isso, probes tipo
    # /.env, /.git/config ou /.aws/credentials caem no fallback da SPA
    # e recebem 200 com o index.html (o scanner interpreta como "achou").
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Paths com "cara de arquivo" (com extensão) só servem se existirem de
    # verdade: sem fallback pra SPA (evita 200 falso em /x.json, *.xml etc.).
    location ~* \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # App SPA nas demais rotas (/login, /register, /dashboard, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ garante que as regras de regex acima (dotfiles/extensões) não
    # interceptem caminhos da API.
    location ^~ /api {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserva o protocolo encaminhado pelo proxy externo (Traefik/Cloudflare
        # terminam o TLS e mandam X-Forwarded-Proto: https). Sem proxy na frente
        # o header chega vazio e a API cai no esquema local (http).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
