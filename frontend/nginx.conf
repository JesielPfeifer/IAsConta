resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page na raiz
    location = / {
        try_files /landing.html =404;
        # try_files que serve o arquivo existente NÃO reavalia os locations:
        # sem o header aqui, a landing sairia sem Cache-Control.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Landing também acessível em /landing
    location = /landing {
        try_files /landing.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Segurança: dotfiles nunca são servidos. Sem isso, probes tipo
    # /.env, /.git/config ou /.aws/credentials caem no fallback da SPA
    # e recebem 200 com o index.html (o scanner interpreta como "achou").
    # Exceção só para o segmento exato `.well-known` (seguido de / ou fim) —
    # `/.well-known-backup` não é exceção e cai no 404 (review #39).
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # HTML NUNCA pode ser cacheado: o index.html aponta para o bundle com hash
    # daquele build. Se o browser guarda um index.html velho, ele tenta rodar
    # um bundle que já saiu do servidor — tela branca e erro de React no
    # console (ex.: "Minified React error #310") até dar Ctrl+Shift+R.
    # Precisa vir ANTES da regra genérica de extensão: location com regex é
    # avaliado na ordem em que aparece no arquivo, e `\.[a-zA-Z0-9]+$` também
    # casaria com ".html".
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Paths com "cara de arquivo" (com extensão) só servem se existirem de
    # verdade: sem fallback pra SPA (evita 200 falso em /x.json, *.xml etc.).
    location ~* \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Assets com hash no nome são imutáveis: podem ficar 1 ano no browser.
    # ^~ tem precedência sobre as regex acima, então /assets/*.js e *.css
    # caem aqui em vez da regra genérica de extensão.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # App SPA nas demais rotas (/login, /register, /dashboard, etc.)
    location / {
        try_files $uri $uri/ /index.html;
        # Fallback da SPA é HTML: sempre revalidar
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ^~ garante que as regras de regex acima (dotfiles/extensões) não
    # interceptem caminhos da API. Prefixo COM barra + location exata para
    # `/api` puro: sem a barra, `^~ /api` também casaria /api.json, que deve
    # cair no 404 de arquivo (review #39).
    location = /api {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserva o protocolo encaminhado pelo proxy externo (Traefik/Cloudflare
        # terminam o TLS e mandam X-Forwarded-Proto: https). Sem proxy na frente
        # o header chega vazio e a API cai no esquema local (http).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location ^~ /api/ {
        set $api_upstream api:3001;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserva o protocolo encaminhado pelo proxy externo (Traefik/Cloudflare
        # terminam o TLS e mandam X-Forwarded-Proto: https). Sem proxy na frente
        # o header chega vazio e a API cai no esquema local (http).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
